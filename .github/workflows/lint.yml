name: Linting, check-types and formatting on PR

on:
  pull_request:
    branches:
      - "**"

jobs:
  Continuous-Integration:
    name: Performs linting, check-types, formatting on the application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run linting check
        run: npm run lint

      - name: Run formatting check
        run: npm run format

      - name: Run type check
        run: npm run check-types
